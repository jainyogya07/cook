services:
  - type: web
    name: atmos-4d-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: RELOAD
        value: "false"
      - key: WORKERS
        value: "1"
      - key: AUTH_DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ATMOS_SEED_EMAIL
        value: seed@atmos4d.ai
      - key: ATMOS_SEED_NAME
        value: ATMOS Seed
      - key: ATMOS_SEED_PASSWORD
        sync: false
      - key: ATMOS_SEED_PLAN
        value: pro
