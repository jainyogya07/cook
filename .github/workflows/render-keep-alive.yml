name: Render Backend Keep-Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier inactivity sleep (15 min cutoff)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set. Add it in GitHub Repo Settings -> Secrets -> Actions."
            echo "Example: https://your-backend.onrender.com"
            exit 0
          fi
          echo "Pinging ${BACKEND_URL}/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${BACKEND_URL}/health")
          echo "HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Render backend is alive and warm!"
          else
            echo "Render returned HTTP ${HTTP_STATUS}. Service may be waking up."
          fi
